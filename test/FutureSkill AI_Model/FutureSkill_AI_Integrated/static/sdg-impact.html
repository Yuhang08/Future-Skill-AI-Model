
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FutureSkill AI | SDG Impact Map</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #edf4f7;
    color: #153444;
}

header {
    padding: 22px 6%;
    background: #123447;
    color: white;
}

header a {
    color: #91e5ce;
    text-decoration: none;
}

main {
    max-width: 1100px;
    margin: auto;
    padding: 30px 20px;
}

h1 { margin-bottom: 8px; }

.subtitle { color: #64748b; }

.controls {
    display: flex;
    gap: 12px;
    margin: 25px 0;
    flex-wrap: wrap;
}

input {
    flex: 1;
    min-width: 200px;
    padding: 14px;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    font-size: 16px;
}

button {
    cursor: pointer;
    border: 0;
    border-radius: 12px;
    padding: 14px 22px;
    background: #119b80;
    color: white;
    font-weight: bold;
}

.stage {
    position: relative;
    height: 570px;
    background: radial-gradient(
        circle at center,
        #ffffff,
        #e0f2f1
    );
    border-radius: 25px;
    overflow: hidden;
    box-shadow: 0 12px 35px #15344418;
}

.lines {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.center {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 195px;
    min-height: 120px;
    background: #123f4a;
    color: white;
    border-radius: 22px;
    padding: 20px;
    display: grid;
    place-items: center;
    text-align: center;
    font-weight: bold;
    box-shadow: 0 10px 30px #123f4a38;
}

.goal {
    position: absolute;
    transform: translate(-50%, -50%);
    width: 185px;
    min-height: 135px;
    padding: 16px;
    border: 0;
    border-radius: 18px;
    color: white;
    text-align: left;
    box-shadow: 0 10px 25px #102a4325;
    transition: transform .2s;
}

.goal:hover {
    transform: translate(-50%, -50%) scale(1.07);
}

.goal strong {
    display: block;
    font-size: 29px;
    margin-bottom: 7px;
}

.goal small {
    display: block;
    font-weight: bold;
    line-height: 1.4;
}

.skills {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 10px;
}

.skill {
    font-size: 10px;
    padding: 5px 7px;
    border-radius: 7px;
    background: #ffffff30;
}

.details {
    background: white;
    border-radius: 18px;
    padding: 24px;
    margin-top: 20px;
}

#message { color: #64748b; }

@media(max-width:720px) {
    .stage {
        height: auto;
        min-height: 350px;
        padding: 20px;
        display: flex;
        flex-wrap: wrap;
        align-items: stretch;
        justify-content: center;
        gap: 14px;
    }

    .center, .goal {
        position: static;
        transform: none !important;
        width: 100%;
        max-width: 300px;
    }

    .lines { display: none; }
}
</style>
</head>

<body>

<header>
    <a href="/">← Back to FutureSkill AI</a>
</header>

<main>
    <h1>🌍 Career Impact Mind Map</h1>
    <p class="subtitle">
        Discover how your career connects to the
        17 UN Sustainable Development Goals.
    </p>

    <div class="controls">
        <div style="flex:1;min-width:220px">
            <label for="careerInput">Search supported careers</label>
            <input id="careerInput" role="combobox" aria-autocomplete="list"
                   aria-expanded="false" aria-controls="careerOptions" autocomplete="off"
                   placeholder="Type a career, then select a result" maxlength="120" style="width:100%">
            <ul id="careerOptions" role="listbox" aria-label="Career results" hidden></ul>
        </div>
        <button id="exploreCareer" disabled>Explore career</button>
    </div>

    <p id="message" role="status"></p>

    <div class="stage" id="mindmap"></div>
    <details><summary>Browse all 17 goals independently</summary><div id="allGoals"></div></details>

    <section class="details" id="details">
        Select an SDG node to explore its potential impact.
    </section>

    <p class="subtitle">
        SDG links are illustrative, not verified social impact.
    </p>
</main>

<script>
let lastData = null;
let selectedCareer = null;
let results = [];
let activeIndex = -1;
let searchVersion = 0;
let debounce;
const input = document.getElementById('careerInput');
const options = document.getElementById('careerOptions');
const explore = document.getElementById('exploreCareer');
const message = document.getElementById('message');

function closeOptions() {
    options.hidden = true;
    input.setAttribute('aria-expanded', 'false');
    input.removeAttribute('aria-activedescendant');
}
function choose(index) {
    selectedCareer = results[index];
    input.value = selectedCareer.title;
    explore.disabled = false;
    closeOptions();
    message.textContent = 'Selected ' + selectedCareer.title + '. ' +
        (selectedCareer.mapping_status === 'reviewed' ? 'Curated mapping available.' : 'Not yet reviewed.');
    input.focus();
}
input.addEventListener('input', () => {
    selectedCareer = null;
    lastData = null;
    document.getElementById('mindmap').replaceChildren();
    document.getElementById('details').textContent = 'Select a supported career to inspect its connections.';
    explore.disabled = true;
    activeIndex = -1;
    closeOptions();
    clearTimeout(debounce);
    const version = ++searchVersion;
    const query = input.value.trim();
    if (!query) { message.textContent = 'Search and select a supported career.'; return; }
    message.textContent = 'Searching careers…';
    debounce = setTimeout(async () => {
        try {
            const response = await fetch('/api/careers?q=' + encodeURIComponent(query));
            if (!response.ok) throw new Error('Career search failed. Edit the search to retry.');
            const payload = await response.json();
            if (version !== searchVersion) return;
            results = payload.results;
            options.replaceChildren();
            results.forEach((career, index) => {
                const item = document.createElement('li');
                item.id = 'career-option-' + index;
                item.setAttribute('role', 'option');
                item.setAttribute('aria-selected', 'false');
                item.textContent = career.title + ' — ' + career.kind + ' — ' +
                    (career.mapping_status === 'reviewed' ? 'curated mapping available' : 'not yet reviewed');
                item.style.cssText = 'padding:12px;cursor:pointer;background:white;color:#153444';
                item.addEventListener('mousedown', event => event.preventDefault());
                item.addEventListener('click', () => choose(index));
                options.appendChild(item);
            });
            options.hidden = !results.length;
            input.setAttribute('aria-expanded', String(!!results.length));
            message.textContent = results.length ? 'Select a result. Use arrow keys and Enter, or click.' :
                'No supported career found. Try another title or keyword.';
        } catch (error) { if (version === searchVersion) message.textContent = error.message; }
    }, 200);
});
input.addEventListener('keydown', event => {
    if (event.key === 'Escape') { ++searchVersion; clearTimeout(debounce); closeOptions(); return; }
    if (!options.hidden && ['ArrowDown', 'ArrowUp'].includes(event.key)) {
        event.preventDefault();
        activeIndex = (activeIndex + (event.key === 'ArrowDown' ? 1 : -1) + results.length) % results.length;
        [...options.children].forEach((node, i) => {
            node.setAttribute('aria-selected', String(i === activeIndex));
            node.style.background = i === activeIndex ? '#cce8f0' : 'white';
        });
        input.setAttribute('aria-activedescendant', options.children[activeIndex].id);
        options.children[activeIndex].scrollIntoView({block:'nearest'});
    }
    if (event.key === 'Enter') {
        event.preventDefault();
        if (!options.hidden && activeIndex >= 0) choose(activeIndex);
        else if (selectedCareer) generateMap();
    }
});
input.addEventListener('blur', closeOptions);
explore.addEventListener('click', generateMap);

async function generateMap() {
    if (!selectedCareer) { message.textContent = 'Choose a career from the search results.'; return; }
    const careerId = selectedCareer.id;
    explore.disabled = true;
    message.textContent = 'Loading career connections…';
    try {
        const response = await fetch('/api/sdg/mindmap', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({career_id: careerId})
        });
        const data = await response.json();
        if (selectedCareer?.id !== careerId) return;
        if (!response.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'Unable to load career.');
        lastData = data;
        renderMap(data);
        message.textContent = data.note;
        const all = document.getElementById('allGoals');
        all.replaceChildren();
        data.all_goals.forEach(goal => {
            const link = document.createElement('a');
            link.href = goal.url; link.target = '_blank'; link.rel = 'noopener noreferrer';
            link.textContent = 'SDG ' + goal.id + ': ' + goal.name;
            const row = document.createElement('p'); row.appendChild(link); all.appendChild(row);
        });
    } catch (error) { message.textContent = 'Error: ' + error.message; }
    finally { explore.disabled = !selectedCareer; }
}

function renderMap(data) {

    const area = document.getElementById("mindmap");
    const details = document.getElementById("details");

    area.replaceChildren();
    details.textContent =
        "Select a coloured SDG node to view its impact.";

    const svg = document.createElementNS(
        "http://www.w3.org/2000/svg", "svg"
    );

    svg.classList.add("lines");
    area.appendChild(svg);

    const center = document.createElement("div");
    center.className = "center";
    center.textContent = data.career;
    area.appendChild(center);

    const goals = data.goals.length ? data.goals : data.suggestions;
    if (!goals.length) details.textContent = "Career found; no reviewed mappings or keyword suggestions. Browse the goals independently.";

    goals.forEach((goal, index) => {

        const angle =
            -Math.PI / 2 +
            (2 * Math.PI * index / goals.length);

        const x = 50 + 34 * Math.cos(angle);
        const y = 50 + 34 * Math.sin(angle);

        const node = document.createElement("button");
        node.className = "goal";
        node.style.background = goal.color;
        node.style.left = x + "%";
        node.style.top = y + "%";

        const number = document.createElement("strong");
        number.textContent = goal.id;

        const name = document.createElement("small");
        name.textContent = goal.name + (goal.provisional ? ' · Unreviewed suggestion' : ' · Reviewed potential link');

        node.appendChild(number);
        node.appendChild(name);

        const skillBox = document.createElement("div");
        skillBox.className = "skills";

        (data.skills || []).forEach(skill => {

            const related = skill.sdgs.some(
                g => g.id === goal.id
            );

            if (related) {
                const tag = document.createElement("span");
                tag.className = "skill";
                tag.textContent =
                    skill.skill.replace("Skill", "");
                skillBox.appendChild(tag);
            }
        });

        node.appendChild(skillBox);

        node.onclick = () => {

            details.replaceChildren();

            const title = document.createElement("h2");
            title.textContent =
                "SDG " + goal.id + ": " + goal.name;

            const desc = document.createElement("p");
            desc.textContent = goal.reason;

            const link = document.createElement("a");
            link.href = goal.url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = "Explore the UN Goal ↗";

            details.append(title, desc, link);
            if (goal.target_id) {
                const evidence = document.createElement('p');
                evidence.textContent = 'Target ' + goal.target_id + ' · Evidence: ' +
                    JSON.stringify(goal.evidence) + ' · Limitations: ' + goal.limitations;
                details.appendChild(evidence);
            }

            if (goal.provisional) {
                const warning = document.createElement("p");
                warning.textContent =
                    "Keyword suggestion only. No reviewed target-level evidence; not measured impact.";
                details.appendChild(warning);
            }
        };

        area.appendChild(node);
    });

    // SVG lines connecting career to SDGs
    function drawLines() {

        svg.replaceChildren();

        if (window.innerWidth <= 720) return;

        const width = area.clientWidth;
        const height = area.clientHeight;

        svg.setAttribute(
            "viewBox", `0 0 ${width} ${height}`
        );

        goals.forEach((goal, index) => {

            const angle =
                -Math.PI / 2 +
                (2 * Math.PI * index / goals.length);

            const x = width * (
                0.5 + 0.34 * Math.cos(angle)
            );

            const y = height * (
                0.5 + 0.34 * Math.sin(angle)
            );

            const line = document.createElementNS(
                "http://www.w3.org/2000/svg", "line"
            );

            line.setAttribute("x1", width / 2);
            line.setAttribute("y1", height / 2);
            line.setAttribute("x2", x);
            line.setAttribute("y2", y);
            line.setAttribute("stroke", goal.color);
            line.setAttribute("stroke-width", "4");
            line.setAttribute("stroke-opacity", "0.65");

            svg.appendChild(line);
        });
    }

    drawLines();
}

window.addEventListener("resize", () => {
    if (lastData) renderMap(lastData);
});

message.textContent = 'Search and select a career to explore supported connections.';
</script>

</body>
</html>
